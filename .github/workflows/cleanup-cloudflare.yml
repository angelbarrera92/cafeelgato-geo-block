name: cleanup-cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ZONE: 0014cf7aefcfb02a76cee3279070336d
      WORKER: cafeelgato-geo-block
      PAGES: cafeelgato-geo-block
    steps:
      - name: Delete worker routes
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/workers/routes" \
            | jq -r '.result[]? | [.id,.pattern] | @tsv' \
            | while IFS=$'\t' read -r id pattern; do
                case "$pattern" in
                  "cafeelgato.com/*"|"www.cafeelgato.com/*")
                    echo "deleting route $pattern ($id)"
                    curl -s -X DELETE -H "Authorization: Bearer $CF_TOKEN" \
                      "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/workers/routes/$id" \
                      | jq -e '.success' >/dev/null
                    ;;
                esac
              done

      - name: Delete worker script
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/worker.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/$WORKER")
          echo "worker delete HTTP $code"
          cat /tmp/worker.json | jq -c '{success,errors}' || true
          [ "$code" = "200" ] || [ "$code" = "404" ] || exit 1

      - name: Delete Pages project
        run: |
          set -euo pipefail
          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PAGES")
          echo "pages delete HTTP $code"
          cat /tmp/pages.json | jq -c '{success,errors}' || true
          [ "$code" = "200" ] || [ "$code" = "404" ] || exit 1

      - name: Verify remaining resources
        run: |
          set -euo pipefail
          echo "workers:"
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts" \
            | jq -r '.result[]?.id' || true
          echo "pages:"
          curl -s -H "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects" \
            | jq -r '.result[]?.name' || true
